[project]
name = "langchain-ollama-mlflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arnaud Konan", email = "arnaudkonan369@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.4.0",
    "langchain-ollama>=1.1.0",
    "mlflow>=3.0.0",
]

[project.scripts]
langchain-ollama-mlflow = "langchain_ollama_mlflow:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
